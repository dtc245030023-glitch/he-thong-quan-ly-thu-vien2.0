global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: library-management

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Node.js / Express application metrics (express-prom-bundle + prom-client).
  - job_name: library-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: app

  # Per-container CPU, memory, network and filesystem metrics.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # PostgreSQL metrics via postgres_exporter.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  # Nginx request/connection metrics via nginx-prometheus-exporter.
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
