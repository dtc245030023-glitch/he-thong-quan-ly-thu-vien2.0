name: library-management

services:
  # -------------------------------------------------------------------------
  # Node.js + Express application (server-rendered frontend + backend)
  # -------------------------------------------------------------------------
  app:
    build:
      context: ./app
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Hãy tạo file .env từ .env.example}
      PGUSER: ${POSTGRES_USER:?Hãy tạo file .env từ .env.example}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Hãy tạo file .env từ .env.example}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  # -------------------------------------------------------------------------
  # PostgreSQL 16 with persistent storage and health checks
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Hãy tạo file .env từ .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?Hãy tạo file .env từ .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy tạo file .env từ .env.example}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  # -------------------------------------------------------------------------
  # pgAdmin 4 (only reachable through Nginx at /pgadmin/)
  # -------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Hãy tạo file .env từ .env.example}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Hãy tạo file .env từ .env.example}
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5050"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/misc/ping', timeout=5)\" >/dev/null 2>&1",
        ]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  # -------------------------------------------------------------------------
  # Monitoring: Prometheus, cAdvisor, exporters and Grafana
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  # cAdvisor reads container cgroups to expose CPU/RAM/network metrics.
  # It requires privileged access to the Docker host, so it is not published.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    privileged: true
    # Required on Docker Desktop/WSL so cAdvisor can see host container cgroups.
    cgroup: host
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:?Hãy tạo file .env từ .env.example}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?Hãy tạo file .env từ .env.example}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Hãy tạo file .env từ .env.example}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9187"
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      nginx:
        condition: service_started
    expose:
      - "9113"
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Hãy tạo file .env từ .env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  # -------------------------------------------------------------------------
  # Nginx reverse proxy — public entrypoint on ports 80 and 443
  # -------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
      pgadmin:
        condition: service_started
      grafana:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - nginx-certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

networks:
  # Dedicated, isolated bridge network: only these four containers can talk
  # to each other. PostgreSQL and pgAdmin are not published to the host.
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  nginx-certs:
  prometheus-data:
  grafana-data:
