upstream library_app {
    server app:3000;
    keepalive 16;
}

upstream pgadmin_ui {
    server pgadmin:5050;
    keepalive 8;
}

# ---------------------------------------------------------------------------
# HTTP (port 80). HTTP is kept available for local demos; in production,
# redirect it to HTTPS by uncommenting the return rule below.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # return 301 https://$host$request_uri;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /pgadmin {
        return 308 /pgadmin/;
    }

    location /pgadmin/ {
        include /etc/nginx/snippets/security-pgadmin.conf;

        proxy_pass http://pgadmin_ui/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_redirect off;
        proxy_cookie_path / /pgadmin/;
        proxy_read_timeout 120s;

        # We control security headers at the edge.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        include /etc/nginx/snippets/security-app.conf;

        proxy_pass http://library_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (port 443). A self-signed certificate is generated automatically on
# first start. Replace /etc/nginx/certs with real certificates in production.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /pgadmin {
        return 308 /pgadmin/;
    }

    location /pgadmin/ {
        include /etc/nginx/snippets/security-pgadmin.conf;

        proxy_pass http://pgadmin_ui/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_redirect off;
        proxy_cookie_path / /pgadmin/;
        proxy_read_timeout 120s;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location / {
        include /etc/nginx/snippets/security-app.conf;

        proxy_pass http://library_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
